# Stand-in for the Dinerzflow vendor/voucher API while that backend is built.
# The shape of this file mirrors what VendorDirectory::Adapter is expected to
# return, so swapping MockAdapter for the HTTP client changes no caller.
#
# Distances are from a notional Kota Kinabalu city-centre property.

categories:
  - slug: food-drink
    name: Food & Drink
    tagline: Where the city actually eats
    icon: utensils-crossed

  - slug: bars
    name: Bars
    tagline: Sundowners, rooftops and late ones
    icon: wine

  - slug: wellness
    name: Wellness
    tagline: Undo the flight
    icon: sparkles

  - slug: health
    name: Health & Pharmacy
    tagline: For when the trip needs a hand
    icon: pill

  - slug: shopping
    name: Shopping
    tagline: Take a bit of Sabah home
    icon: shopping-bag

