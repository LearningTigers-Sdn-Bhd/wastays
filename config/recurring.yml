production:
  release_expired_holds:
    class: BookingEngine::ReleaseExpiredHoldsJob
    schedule: every minute
  pull_channex_revisions:
    class: ChannelManagers::PullRevisionsJob
    schedule: every 15 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  prune_observation_entries:
    class: ObservationDeck::PruneEntriesJob
    schedule: at 3am every day
  cleanup_room_locks:
    class: CleanupRoomLocksJob
    schedule: every 5 minutes
  run_scheduled_night_audits:
    class: NightAudits::RunScheduledJob
    schedule: every 15 minutes
  financial_observability:
    class: FinancialObservabilityJob
    schedule: every hour
  retry_onboarding_deliveries:
    class: Onboarding::DispatchPendingDeliveriesJob
    schedule: every 5 minutes
  monthly_e_invoice_consolidation:
    class: EInvoice::MonthlyConsolidationJob
    schedule: "cron 5 0 1 * *"
  monthly_ota_commission_self_billing:
    class: EInvoice::MonthlyOtaCommissionJob
    schedule: "cron 20 0 1 * *"
  close_stale_conversations:
    class: Concierge::CloseStaleConversationsJob
    schedule: every hour at minute 24

