production:
  release_expired_holds:
    class: BookingEngine::ReleaseExpiredHoldsJob
    schedule: every minute
  pull_channex_revisions:
    class: ChannelManagers::PullRevisionsJob
    schedule: every 15 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  prune_observation_entries:
    command: "bin/rake observation:prune"
    schedule: at 3am every day
  run_scheduled_night_audits:
    class: RunScheduledNightAuditsJob
    schedule: at 6am every day

demo:
  release_expired_holds:
    class: BookingEngine::ReleaseExpiredHoldsJob
    schedule: every minute
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  run_scheduled_night_audits:
    class: RunScheduledNightAuditsJob
    schedule: at 6am every day
