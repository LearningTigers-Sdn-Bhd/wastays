<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for rounded, cute typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#0f4a43',
                            secondary: '#0d3d37',
                            gold: '#d9c5a0',
                        }
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        quicksand: ['Quicksand', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-white text-[#0d3d37] font-quicksand flex flex-col justify-between overflow-hidden">

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 relative">
        
        <!-- Funny Suitcase Area -->
        <div class="relative flex flex-col items-center select-none">
            
            <!-- Character Container -->
            <div id="characterWrapper" class="relative">
                
                <!-- Custom SVG Suitcase (Luggy) -->
                <svg id="luggageSvg" width="200" height="210" viewBox="0 0 200 210" fill="none" class="drop-shadow-md">
                    <!-- Handle -->
                    <path d="M80 60 V43 C80 37, 120 37, 120 43 V60" stroke="#0f4a43" stroke-width="4.5" fill="none" stroke-linecap="round" />
                    
                    <!-- Suitcase Main Body -->
                    <rect x="40" y="60" width="120" height="100" rx="16" fill="#d9c5a0" stroke="#0f4a43" stroke-width="4.5" />
                    
                    <!-- Straps -->
                    <rect x="65" y="60" width="12" height="100" fill="#0f4a43" />
                    <rect x="123" y="60" width="12" height="100" fill="#0f4a43" />
                    
                    <!-- Corner Guards -->
                    <!-- Top-Left -->
                    <path d="M40 78 C40 68, 50 60, 58 60" stroke="#0f4a43" stroke-width="4" fill="none" stroke-linecap="round" />
                    <!-- Top-Right -->
                    <path d="M160 78 C160 68, 150 60, 142 60" stroke="#0f4a43" stroke-width="4" fill="none" stroke-linecap="round" />
                    <!-- Bottom-Left -->
                    <path d="M40 142 C40 152, 50 160, 58 160" stroke="#0f4a43" stroke-width="4" fill="none" stroke-linecap="round" />
                    <!-- Bottom-Right -->
                    <path d="M160 142 C160 152, 150 160, 142 160" stroke="#0f4a43" stroke-width="4" fill="none" stroke-linecap="round" />
                    
                    <!-- Blushing Cheeks -->
                    <circle cx="58" cy="118" r="8" fill="#FFB7B2" opacity="0.6" />
                    <circle cx="142" cy="118" r="8" fill="#FFB7B2" opacity="0.6" />

                    <!-- Googly Silly Eyes -->
                    <!-- Left Eye (Big) -->
                    <circle cx="75" cy="100" r="16" fill="white" stroke="#0f4a43" stroke-width="4" />
                    <circle cx="79" cy="102" r="6" fill="#0d3d37" />
                    <circle cx="77" cy="100" r="2.2" fill="white" />
                    
                    <!-- Right Eye (Silly Small) -->
                    <circle cx="120" cy="104" r="11" fill="white" stroke="#0f4a43" stroke-width="4" />
                    <circle cx="118" cy="106" r="4.5" fill="#0d3d37" />
                    <circle cx="116" cy="104" r="1.7" fill="white" />

                    <!-- Wavy Confused Mouth -->
                    <path d="M 88 128 Q 96 133 100 127 T 112 129" stroke="#0f4a43" stroke-width="3.5" fill="none" stroke-linecap="round" />

                    <!-- Stick Arm Scratching Head -->
                    <path d="M40 110 C 20 98, 20 62, 60 52" stroke="#0f4a43" stroke-width="4" fill="none" stroke-linecap="round" />
                    
                    <!-- Stick Arm Holding Map -->
                    <path d="M160 110 Q 182 120 178 142" stroke="#0f4a43" stroke-width="4" fill="none" stroke-linecap="round" />
                    
                    <!-- Upside Down Map -->
                    <g transform="translate(155, 132) rotate(165)">
                        <rect x="0" y="0" width="38" height="26" rx="4" fill="white" stroke="#0f4a43" stroke-width="3" />
                        <!-- squiggles -->
                        <path d="M6 6 L18 18 L32 6" stroke="#EADBC8" stroke-width="2" fill="none" />
                        <path d="M10 20 L28 10" stroke="#0f4a43" stroke-width="2" fill="none" />
                        <!-- Red X marker -->
                        <path d="M26 16 L32 22 M32 16 L26 22" stroke="#C26D51" stroke-width="2.5" stroke-linecap="round" />
                    </g>

                    <!-- Stick Legs -->
                    <path d="M75 160 V185 H63" stroke="#0f4a43" stroke-width="4" fill="none" stroke-linecap="round" />
                    <path d="M125 160 V185 H137" stroke="#0f4a43" stroke-width="4" fill="none" stroke-linecap="round" />
                    
                    <!-- Funny Slippers -->
                    <ellipse cx="58" cy="186" rx="11" ry="6" fill="#FFFDF9" stroke="#0f4a43" stroke-width="2.5" />
                    <ellipse cx="142" cy="186" rx="11" ry="6" fill="#FFFDF9" stroke="#0f4a43" stroke-width="2.5" />
                </svg>
            </div>
        </div>

        <!-- Typography & Descriptions -->
        <div class="text-center mt-10 max-w-md mx-auto">
            <h1 class="font-fredoka text-7xl md:text-8xl font-bold tracking-tight text-[#0f4a43] drop-shadow-sm select-none">
                404
            </h1>
            <h2 class="font-fredoka text-xl md:text-2xl font-semibold mt-2 text-[#0d3d37]">
                Oops! Page Not Found
            </h2>
            <p class="text-sm md:text-base mt-3 text-[#5C7267] leading-relaxed max-w-sm mx-auto">
                The page you are looking for doesn't exist or may have been moved.
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center gap-4 mt-8 w-full justify-center max-w-md mx-auto">
            <a href="/" class="w-full sm:w-auto text-center px-8 py-3.5 bg-[#0f4a43] hover:bg-[#0a3a34] text-white font-semibold rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 transform active:scale-95">
                Go to Homepage
            </a>
            <a href="/dashboard" class="w-full sm:w-auto text-center px-8 py-3.5 bg-white hover:bg-gray-50 text-[#0f4a43] font-semibold rounded-2xl border border-[#0f4a43] shadow-sm hover:shadow-md transition-all duration-200 transform active:scale-95">
                Go to Dashboard
            </a>
        </div>

    </main>

</body>
</html>
