id: model_invents_the_arrival_day
description: "a month named without a day, and a model that supplies one anyway -- the invented day must not become a date the hotel says has passed"
origin: "a live run: 'early august for 3 days 2 nights' was answered '1 August 2026 has already passed', and every restatement of the month reproduced it"
setup:
  rooms:
    - name: Garden Prestige Suite
      month: 1
      days: [16, 17, 18, 19, 20]
      max_adults: 4
turns:
  # The guest names a window, not a day. The model fills `check_in` with the
  # first of the window anyway -- which is behind today, because the month is
  # the one we are standing in.
  #
  # The guard that exists to delete an invented day used to stand down here,
  # because it asked whether the message had a digit in it and "3 days 2
  # nights" does. So the invented day reached the ladder, was read as a date in
  # the past, and the thread was told the month had gone -- to which the only
  # answer a guest has is to say the month again, which reproduces it exactly.
  - guest: "mid january for 3 days 2 nights"
    model:
      agent_loop:
        tool: advance_booking
        arguments:
          slots:
            target_month: 1
            target_year: 2026
            month_segment: mid
            check_in: "2026-01-01"
            nights: 2
            days: 3
          evidence:
            timing: "mid january"
            duration: "3 days 2 nights"
    expect:
      pending_question: guest_count
      reply_excludes: ["has already passed"]

  - guest: "2 adults"
    expect:
      pending_question: select_option
      reply_matches: ["Here are the available options", "Garden Prestige Suite"]

  - guest: "1"
    expect:
      pending_question: confirm_selection
      reply_matches: ["Please reply *Yes* to confirm"]

  - guest: "yes"
    expect:
      reply_matches: ["Quotation link:"]
      creates_quote: true
