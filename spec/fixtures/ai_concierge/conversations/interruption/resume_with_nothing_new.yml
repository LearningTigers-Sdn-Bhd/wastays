id: resume_with_nothing_new
description: "a guest who does not answer the repeated option question receives the normal selection reminder"
origin: "the information answer now repeats the pending option question immediately, so the next unrelated message is an unanswered selection"
setup:
  rooms:
    - name: Garden Prestige Suite
      month: 9
      days: [10, 11, 12]
    - name: Ocean Villa
      month: 9
      days: [10, 11, 12]
  knowledge:
    - category: general_info
      title: Getting Here
      chunks: ["Parking is free for registered guests in the basement car park."]
turns:
  - guest: "book 10 september to 12 september"
    expect:
      pending_question: guest_count

  - guest: "2 adults"
    expect:
      pending_question: select_option

  - guest: "is there parking?"
    expect:
      reply_matches: ["Parking is free"]
      booking_status: waiting_for_option_selection

  # The information response already showed the pending list again. This next
  # message does not select a row, so the ordinary selection reminder applies.
  - guest: "hello again"
    model:
      agent_loop:
        tool: advance_booking
        arguments:
          slots: {}
    expect:
      pending_question: select_option
      reply_matches: ["Sorry, I didn't catch that", "I couldn't match that"]
      creates_quote: false
