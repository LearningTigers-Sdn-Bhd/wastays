id: resume_with_a_changed_search
description: "a booking put down mid-list and picked up with a changed search: the hotel searches what the guest just said, not what it was holding"
origin: "ResumeHandler read the stored branch, so five of its six exits answered the turn before last"
setup:
  rooms:
    - name: Garden Prestige Suite
      month: 9
      days: [10, 11, 12]
      max_adults: 4
    - name: Ocean Villa
      month: 9
      days: [10, 11, 12]
      max_adults: 4
  knowledge:
    - category: general_info
      title: Getting Here
      chunks: ["Parking is free for registered guests in the basement car park."]
turns:
  - guest: "book 10 september to 12 september"
    expect:
      pending_question: guest_count

  - guest: "2 adults"
    expect:
      pending_question: select_option
      reply_matches: ["2 adults", "1 room", "Garden Prestige Suite"]

  # The list is on the table when the booking is put down.
  - guest: "is there parking?"
    expect:
      reply_matches: ["Parking is free"]
      booking_status: waiting_for_option_selection

  # Picked up with a search the saved list was never priced for. Showing that
  # list again quotes one room to a guest who asked for two -- and writing the
  # old branch back over the new one loses the second room entirely, so the
  # next turn asks nothing and nobody notices.
  - guest: "actually 2 rooms"
    expect:
      pending_question: select_option
      reply_matches: ["2 rooms", "Garden Prestige Suite"]
      reply_excludes: ["1 room", "I couldn't match that", "we saved for you"]
      creates_quote: false
