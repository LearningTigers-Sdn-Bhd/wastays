id: room_rate_starts_price_shopping
description: "asking what a room costs starts price shopping without booking commitment"
origin: "InformationIntentGuard#room_rate_question?"
setup:
  knowledge:
    - category: general_info
      title: Facilities
      chunks: ["The hotel has a rooftop pool and a gym."]
turns:
  - guest: "how much is a room here?"
    # The model gets this one wrong -- that mistake is why the rule exists.
    model:
      agent_loop:
        tool: get_room_type_details
    expect:
      flow: booking_search
      pending_question: booking_timing
      reply_matches: ["compare current room prices"]
      creates_quote: false
